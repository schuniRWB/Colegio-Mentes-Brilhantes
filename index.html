<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colégio Mentes Brilhantes — Sistema de Gestão Escolar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --brand:#1e5f8c; --brand-dark:#134766; --brand-light:#eaf3fa;
  --accent:#e0a836; --accent-dark:#b9852020;
  --ok:#1f9d5a; --warn:#e0a836; --danger:#d64545; --info:#3b7dd8;
  --bg:#f4f6f9; --card:#ffffff; --border:#e1e6ec;
  --text:#1c2733; --text-dim:#5b6b7c; --text-faint:#8a97a6;
  --radius:10px; --radius-lg:16px;
  --shadow:0 1px 3px rgba(20,30,50,.08), 0 1px 2px rgba(20,30,50,.06);
  --shadow-lg:0 10px 30px rgba(20,30,50,.12);
  --sidebar-w:250px;
  font-size:15px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c7d0da;border-radius:6px;}
a{color:var(--brand);text-decoration:none;}
button{font-family:inherit;}
h1,h2,h3,h4{margin:0 0 4px;font-weight:700;color:var(--text);}
p{margin:0 0 8px;}
.hidden{display:none !important;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);font-size:12.5px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  padding:9px 16px;border-radius:8px;border:1px solid transparent;
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-accent{background:var(--accent);color:#3a2a05;}
.btn-accent:hover{filter:brightness(0.95);}
.btn-outline{background:#fff;border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:#f2f5f8;}
.btn-danger{background:#fdeaea;color:var(--danger);}
.btn-danger:hover{background:#f8d4d4;}
.btn-ok{background:#e7f8ef;color:var(--ok);}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px;}
.btn-icon{padding:7px 9px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;}

/* ---------- Layout ---------- */
#login-screen,#setup-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--brand-dark),var(--brand) 60%,#2c7cad);
  padding:20px;
}
.auth-card{
  background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:430px;padding:34px 30px;
}
.auth-card.wide{max-width:560px;}
.brand-block{text-align:center;margin-bottom:22px;}
.brand-block .logo-circle{
  width:64px;height:64px;border-radius:50%;background:var(--brand-light);
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 10px;
}
.brand-block h1{font-size:19px;color:var(--brand-dark);}
.brand-block p{color:var(--text-dim);font-size:13px;}

#app-shell{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--brand-dark);color:#dfeaf3;
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;
  transition:transform .2s;padding-top:env(safe-area-inset-top,0px);
}
#sidebar .side-head{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
#sidebar .side-head h1{color:#fff;font-size:15.5px;line-height:1.3;}
#sidebar .side-head span{font-size:11.5px;color:#a9c3d6;}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 10px;}
.nav-section{margin-bottom:6px;}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#7fa3bd;padding:12px 10px 4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:#dfeaf3;cursor:pointer;font-size:13.6px;font-weight:500;margin-bottom:2px;
}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item.active{background:var(--accent);color:#3a2a05;font-weight:700;}
.nav-item .ic{width:18px;text-align:center;}
#sidebar .side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.12);}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#3a2a05;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.user-chip .nm{font-size:12.8px;font-weight:600;color:#fff;line-height:1.2;}
.user-chip .rl{font-size:11px;color:#a9c3d6;}
#logout-btn{width:100%;margin-top:8px;}

#main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
#topbar{
  background:#fff;border-bottom:1px solid var(--border);padding:12px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:30;padding-top:calc(12px + env(safe-area-inset-top,0px));
}
#topbar h2{font-size:17px;}
#menu-toggle{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--brand-dark);}
#main-content{padding:22px;flex:1;}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:35;}

@media (max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main-wrap{margin-left:0;}
  #menu-toggle{display:block;}
  #sidebar-backdrop.show{display:block;}
  #main-content{padding:14px;}
  .grid-cols{grid-template-columns:1fr !important;}
}

/* ---------- Cards / grids ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.card-head h3{font-size:15.5px;}
.grid-cols{display:grid;gap:16px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-3{grid-template-columns:1fr 1fr 1fr;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow);}
.kpi .lbl{font-size:12px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.kpi .val{font-size:24px;font-weight:800;margin-top:4px;}
.kpi .sub{font-size:12px;color:var(--text-faint);margin-top:2px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
thead th{background:#f4f7fa;text-align:left;padding:10px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfc;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-ok{background:#e7f8ef;color:var(--ok);}
.badge-warn{background:#fef5e3;color:#9c6f0f;}
.badge-danger{background:#fdeaea;color:var(--danger);}
.badge-info{background:#e9f1fc;color:var(--info);}
.badge-gray{background:#eef1f5;color:var(--text-dim);}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* ---------- Forms ---------- */
.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light);}
textarea{resize:vertical;min-height:80px;}
.field-row{display:flex;gap:12px;flex-wrap:wrap;}
.field-row .field{flex:1;min-width:160px;}
.help{font-size:11.5px;color:var(--text-faint);margin-top:4px;}
.search-box{position:relative;max-width:280px;}
.search-box input{padding-left:32px;}
.search-box::before{content:'🔎';position:absolute;left:10px;top:8px;font-size:13px;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,25,40,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:26px 14px;overflow-y:auto;}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:640px;box-shadow:var(--shadow-lg);margin:auto;}
.modal.wide{max-width:880px;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-dim);}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:#1c2733;color:#fff;padding:12px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow-lg);max-width:320px;animation:slideIn .2s;}
.toast.ok{background:#166534;} .toast.err{background:#991b1b;}
@keyframes slideIn{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.empty-state{text-align:center;padding:40px 16px;color:var(--text-faint);}
.empty-state .ic{font-size:34px;margin-bottom:8px;}

/* ---------- Print docs ---------- */
.print-doc{background:#fff;padding:40px;max-width:800px;margin:0 auto;font-family:Georgia,'Times New Roman',serif;color:#111;}
.print-doc h1,.print-doc h2,.print-doc h3{font-family:Georgia,serif;}
.print-doc .doc-head{text-align:center;border-bottom:2px solid #333;padding-bottom:14px;margin-bottom:22px;}
.print-doc .doc-head h1{font-size:16px;letter-spacing:.03em;}
.print-doc .doc-head .sub{font-size:12px;color:#444;}
.print-doc .sign-row{display:flex;justify-content:space-between;margin-top:60px;}
.print-doc .sign-block{width:45%;text-align:center;border-top:1px solid #333;padding-top:6px;font-size:12.5px;}
.slip-table{width:100%;border-collapse:collapse;margin:14px 0;font-family:Arial,sans-serif;font-size:12.5px;}
.slip-table th,.slip-table td{border:1px solid #999;padding:6px 9px;text-align:left;}
.slip-table th{background:#f0f0f0;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;margin:0;padding:20px;}
  .no-print{display:none !important;}
}

.login-tag{display:inline-block;background:var(--brand-light);color:var(--brand-dark);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:10px;}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.step-dots span{width:8px;height:8px;border-radius:50%;background:var(--border);}
.step-dots span.active{background:var(--brand);}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip-opt{border:1px solid var(--border);padding:8px 13px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600;}
.chip-opt.sel{background:var(--brand);color:#fff;border-color:var(--brand);}
.progress-bar{height:7px;background:#eef1f5;border-radius:20px;overflow:hidden;}
.progress-bar > div{height:100%;background:var(--ok);}
.two-col-form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media (max-width:600px){.two-col-form{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-wrap" class="toast-wrap"></div>
<script>
/* ====================================================================
   COLÉGIO MENTES BRILHANTES — SISTEMA DE GESTÃO ESCOLAR (ERP)
   Firebase (Firestore + Auth) · Single-file · PWA-ready · Offline
==================================================================== */

/* ---------------------------------------------------------------
   1. FIREBASE CONFIG
   Substitua pelo config do SEU projecto Firebase (Firestore + Auth
   por Email/Senha activados). Ver instruções no fim desta mensagem.
---------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBIglCTgZmEJLaffOjenEWXM_u3pLeArB8",
  authDomain: "colegio-mentes-brilhantes.firebaseapp.com",
  projectId: "colegio-mentes-brilhantes",
  storageBucket: "colegio-mentes-brilhantes.firebasestorage.app",
  messagingSenderId: "923206197653",
  appId: "1:923206197653:web:c4f06e4e65d9b442c8969c"
};

let firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  firebaseReady = true;
}catch(e){ console.error("Firebase init falhou", e); }

const auth = firebaseReady ? firebase.auth() : null;
const db = firebaseReady ? firebase.firestore() : null;
if(db){
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
}

/* ---------------------------------------------------------------
   2. CONSTANTES DO DOMÍNIO
---------------------------------------------------------------- */
const NIVEIS_TURMA = [
  "Berçário","Infantil 1","Infantil 2","Infantil 3","Pré-Escolar",
  "1ª Classe","2ª Classe","3ª Classe","4ª Classe","5ª Classe","6ª Classe","7ª Classe"
];
const FUNCOES_STAFF = [
  "Director(a)","Coordenador(a) Pedagógico(a)","Professor(a)","Educador(a) de Infância",
  "Secretária(o)","Técnico(a) de Contabilidade/Financeiro","Cozinheiro(a)","Auxiliar de Cozinha",
  "Guarda / Segurança","Auxiliar de Limpeza","Motorista","Enfermeiro(a) Escolar","Outro"
];
const FORMAS_PAGAMENTO = ["Numerário","M-Pesa","e-Mola","mKesh","Transferência Bancária","Depósito Bancário","Cheque","POS/Cartão"];
const ROLES = {
  diretor:{label:"Director(a)"}, financeiro:{label:"Financeiro"}, rh:{label:"Recursos Humanos"},
  secretaria:{label:"Secretaria"}, pedagogico:{label:"Coordenação Pedagógica"}, professor:{label:"Professor(a)"}
};
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// IRPS mensal (Moçambique) — tabela configurável em Configurações > Parâmetros Legais
const DEFAULT_IRPS_TABLE = [
  {ate:3500, taxa:0.10, deduzir:0},
  {ate:14000, taxa:0.15, deduzir:175},
  {ate:42000, taxa:0.20, deduzir:875},
  {ate:126000, taxa:0.25, deduzir:3125},
  {ate:Infinity, taxa:0.32, deduzir:11795}
];
const DEFAULT_LEGAL = {
  inssEmpregado:0.03, inssEntidade:0.04, deducaoPessoalMensal:150,
  irpsTable: DEFAULT_IRPS_TABLE, salarioMinimo:0, subsidioFuneralValor:500
};
// Política de mensalidades: janela de pagamento dia 20 (mês corrente) a dia 5 (mês seguinte),
// multa de atraso, desconto para encarregados com vários educandos, e desconto por adiantamento.
const DEFAULT_DESCONTOS = {
  multaAtrasoPct:15, diaAberturaPagamento:20, diaLimitePagamento:5,
  irmaosMinQtd:3, irmaosPercentual:10,
  adiantamentoMinMeses:2, adiantamentoPercentual:5
};

/* ---------------------------------------------------------------
   3. ESTADO GLOBAL
---------------------------------------------------------------- */
const state = {
  user:null, role:null, funcionarioId:null, nomeUtilizador:"",
  school:null, legal:null, descontos:null,
  alunos:[], turmas:[], matriculas:[], mensalidades:[], funcionarios:[], precos:[],
  contratosModelos:[], assiduidade:[], adiantamentos:[], folhas:[],
  planos:[], pautas:[], horarios:[], despesas:[], necessidades:[], usersList:[],
  view:"dashboard", viewParams:{}, sidebarOpen:false, listenersOn:false
};
let unsubs = [];

function fmtMZN(v){
  v = Number(v||0);
  return v.toLocaleString('pt-MZ',{minimumFractionDigits:2,maximumFractionDigits:2}) + " MT";
}
function fmtDate(d){
  if(!d) return "—";
  let dt = (d instanceof Date) ? d : (d.toDate ? d.toDate() : new Date(d));
  if(isNaN(dt)) return "—";
  return dt.toLocaleDateString('pt-MZ',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s===undefined||s===null)?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg,type){
  const w = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (type==='ok'?'ok':type==='err'?'err':'');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(()=>t.remove(), 3600);
}

/* ---------------------------------------------------------------
   4. AUTENTICAÇÃO / ARRANQUE
---------------------------------------------------------------- */
function renderRoot(html){ document.getElementById('root').innerHTML = html; }

async function bootApp(){
  if(!firebaseReady){
    renderRoot(`<div id="login-screen"><div class="auth-card"><div class="brand-block">
      <div class="logo-circle">⚠️</div><h1>Configuração do Firebase em falta</h1>
      <p>Edite o ficheiro e insira o <b>firebaseConfig</b> do seu projecto Firebase (Firestore + Authentication por Email/Senha) no topo do &lt;script&gt;.</p>
    </div></div></div>`);
    return;
  }
  renderRoot(`<div id="login-screen"><div class="auth-card"><div class="brand-block"><div class="logo-circle">🎓</div><h1>A carregar…</h1></div></div></div>`);

  // Verifica se já existe configuração da escola (setup inicial)
  let schoolDoc;
  try{ schoolDoc = await db.collection('config').doc('school').get(); }
  catch(e){ schoolDoc = {exists:false}; }

  auth.onAuthStateChanged(async (user)=>{
    if(!schoolDoc.exists){
      renderSetupWizard();
      return;
    }
    state.school = schoolDoc.data();
    if(user){
      let udoc;
      try{ udoc = await db.collection('users').doc(user.uid).get(); }catch(e){ udoc=null; }
      if(udoc && udoc.exists){
        const ud = udoc.data();
        state.user = user; state.role = ud.role; state.funcionarioId = ud.funcionarioId||null;
        state.nomeUtilizador = ud.nome || user.email;
        attachListeners();
      }else{
        renderLogin("A sua conta não está associada a nenhum perfil. Contacte o Director/RH.");
      }
    }else{
      renderLogin();
    }
  });
}

function renderLogin(errorMsg){
  renderRoot(`
  <div id="login-screen">
    <div class="auth-card">
      <div class="brand-block">
        <div class="logo-circle">🎓</div>
        <h1>${esc(state.school?.nome||"Colégio Mentes Brilhantes")}</h1>
        <p>Sistema Integrado de Gestão Escolar</p>
      </div>
      ${errorMsg?`<div class="badge badge-danger" style="display:block;padding:10px;margin-bottom:14px;">${esc(errorMsg)}</div>`:""}
      <form id="login-form">
        <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="username"></div>
        <div class="field"><label>Senha</label><input type="password" id="login-pass" required autocomplete="current-password"></div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <p style="text-align:center;margin-top:12px;"><a href="#" onclick="esqueciSenha();return false;">Esqueci a minha senha</a></p>
      </form>
      <p class="faint" style="text-align:center;margin-top:16px;">Acesso apenas para pessoal autorizado do Colégio.</p>
    </div>
  </div>`);
  document.getElementById('login-form').onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    try{
      await auth.signInWithEmailAndPassword(email,pass);
    }catch(err){
      renderLogin("Credenciais inválidas: " + (err.message||""));
    }
  };
}

async function esqueciSenha(){
  const email = (document.getElementById('login-email')?.value||'').trim();
  if(!email){ toast('Escreva o seu email no campo acima e clique novamente.','err'); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    toast('Enviámos um link de redefinição de senha para '+email+'.','ok');
  }catch(err){ toast('Não foi possível enviar: '+(err.message||''),'err'); }
}
function abrirAlterarSenha(){
  openModal(`
    <div class="modal-head"><h3>🔑 Alterar a minha senha</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Senha actual</label><input id="pw-atual" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Nova senha (mínimo 6 caracteres)</label><input id="pw-nova" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar nova senha</label><input id="pw-conf" type="password" autocomplete="new-password"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="pw-btn">Guardar nova senha</button></div>
  `);
  document.getElementById('pw-btn').onclick = async ()=>{
    const atual=document.getElementById('pw-atual').value, nova=document.getElementById('pw-nova').value, conf=document.getElementById('pw-conf').value;
    if(!atual||!nova){ toast('Preencha todos os campos.','err'); return; }
    if(nova.length<6){ toast('A nova senha deve ter pelo menos 6 caracteres.','err'); return; }
    if(nova!==conf){ toast('A confirmação não coincide com a nova senha.','err'); return; }
    if(nova===atual){ toast('A nova senha deve ser diferente da actual.','err'); return; }
    const btn=document.getElementById('pw-btn'); btn.disabled=true; btn.textContent='A guardar…';
    try{
      const user=auth.currentUser;
      await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,atual));
      await user.updatePassword(nova);
      closeModal(); toast('Senha alterada com sucesso.','ok');
    }catch(err){
      const bad=['auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(err.code);
      toast(bad?'A senha actual está incorrecta.':'Erro: '+(err.message||''),'err');
      btn.disabled=false; btn.textContent='Guardar nova senha';
    }
  };
}
function logout(){
  detachListeners();
  auth.signOut();
}

const COLLECTIONS = ["alunos","turmas","matriculas","mensalidades","funcionarios",
  "contratosModelos","assiduidade","adiantamentos","folhas","planosAvaliacao",
  "pautas","horarios","despesas","necessidades","precosMensalidades"];
const COL_STATE_KEY = {planosAvaliacao:"planos", precosMensalidades:"precos"};

function attachListeners(){
  if(state.listenersOn) return;
  state.listenersOn = true;
  db.collection('config').doc('legal').get().then(d=>{ state.legal = d.exists? d.data() : DEFAULT_LEGAL; render(); });
  db.collection('config').doc('descontos').get().then(d=>{ state.descontos = d.exists? d.data() : DEFAULT_DESCONTOS; render(); });
  db.collection('users').onSnapshot(snap=>{
    state.usersList = snap.docs.map(d=>({id:d.id,...d.data()})); render();
  });
  COLLECTIONS.forEach(col=>{
    const key = COL_STATE_KEY[col] || col;
    const unsub = db.collection(col).onSnapshot(snap=>{
      state[key] = snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    }, err=>console.error(col,err));
    unsubs.push(unsub);
  });
  renderShell();
}
function detachListeners(){
  unsubs.forEach(u=>u()); unsubs=[];
  state.listenersOn=false;
}

function openModal(innerHtml, opts){
  opts = opts||{};
  const bd = document.createElement('div');
  bd.className='modal-backdrop'; bd.id='active-modal';
  bd.innerHTML = `<div class="modal ${opts.wide?'wide':''}">${innerHtml}</div>`;
  bd.addEventListener('mousedown',(e)=>{ if(e.target===bd) closeModal(); });
  document.body.appendChild(bd);
}
function closeModal(){ const m=document.getElementById('active-modal'); if(m) m.remove(); }

function fieldHtml(f, val){
  val = val===undefined||val===null ? "" : val;
  const req = f.required?"required":"";
  if(f.type==='select'){
    return `<select id="fld_${f.key}" ${req}>${(f.options||[]).map(o=>{
      const [ov,ol] = Array.isArray(o)?o:[o,o];
      return `<option value="${esc(ov)}" ${String(val)===String(ov)?'selected':''}>${esc(ol)}</option>`;
    }).join('')}</select>`;
  }
  if(f.type==='textarea'){
    return `<textarea id="fld_${f.key}" ${req} rows="${f.rows||4}">${esc(val)}</textarea>`;
  }
  return `<input id="fld_${f.key}" type="${f.type||'text'}" ${req} value="${esc(val)}" ${f.step?`step="${f.step}"`:''} placeholder="${esc(f.placeholder||'')}">`;
}
function openFormModal(opts){
  // opts: {title, fields:[{key,label,type,options,required}], initial:{}, onSubmit(data), submitLabel}
  const initial = opts.initial||{};
  const rows = opts.fields.map(f=>{
    if(f.half) return null;
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label>${fieldHtml(f,initial[f.key])}${f.help?`<div class="help">${esc(f.help)}</div>`:''}</div>`;
  });
  // group consecutive half-width fields into rows
  let html=""; let i=0;
  while(i<opts.fields.length){
    const f=opts.fields[i];
    if(f.half){
      let group=[f]; let j=i+1;
      while(j<opts.fields.length && opts.fields[j].half){ group.push(opts.fields[j]); j++; }
      html += `<div class="field-row">${group.map(g=>`<div class="field"><label>${esc(g.label)}${g.required?' *':''}</label>${fieldHtml(g,initial[g.key])}</div>`).join('')}</div>`;
      i=j;
    }else{
      html += `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label>${fieldHtml(f,initial[f.key])}${f.help?`<div class="help">${esc(f.help)}</div>`:''}</div>`;
      i++;
    }
  }
  openModal(`
    <div class="modal-head"><h3>${esc(opts.title)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><form id="generic-form">${html}</form></div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="generic-form-submit">${esc(opts.submitLabel||'Guardar')}</button></div>
  `, {wide:opts.wide});
  document.getElementById('generic-form-submit').onclick = async ()=>{
    const data={};
    for(const f of opts.fields){
      const el = document.getElementById('fld_'+f.key);
      if(!el) continue;
      data[f.key] = f.type==='number' ? (el.value===''?null:Number(el.value)) : el.value;
      if(f.required && (data[f.key]===''||data[f.key]===null)){ toast("Preencha o campo: "+f.label,"err"); return; }
    }
    const btn=document.getElementById('generic-form-submit'); btn.disabled=true; btn.textContent="A guardar…";
    try{ await opts.onSubmit(data); closeModal(); }
    catch(err){ toast("Erro: "+err.message,"err"); btn.disabled=false; btn.textContent=opts.submitLabel||'Guardar'; }
  };
}
function confirmAction(msg, onYes){
  openModal(`
    <div class="modal-head"><h3>Confirmar</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p>${esc(msg)}</p></div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-yes">Confirmar</button></div>`);
  document.getElementById('confirm-yes').onclick = async ()=>{ await onYes(); closeModal(); };
}

function tableShell(columns, rowsHtml, opts){
  opts=opts||{};
  if(!rowsHtml){
    return `<div class="empty-state"><div class="ic">📭</div><p>${esc(opts.emptyMsg||'Sem registos.')}</p></div>`;
  }
  return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}

  </div>
  <div class="grid-cols cols-2">
    <div class="card">
      <div class="card-head"><h3>Alunos por Nível</h3></div>
      ${Object.keys(porNivel).length? Object.entries(porNivel).map(([n,c])=>`

    <div class="card">

/* =================================================================
   12. MENSALIDADES
   Janela normal de pagamento: dia 20 do mês corrente a dia 5 do mês
   seguinte. Após essa data, multa de atraso (%). Desconto automático
   para encarregados com vários educandos, e desconto por adiantamento
   de 2+ mensalidades — ambos configuráveis pelo Director.
================================================================== */
function getDescontos(){ return state.descontos || DEFAULT_DESCONTOS; }
function getPrecoMensalidade(nivel){
  const p = state.precos.find(x=>x.nivel===nivel);
  return p ? Number(p.valor) : null;
}
function diaLimiteMensalidade(mes,ano){
  const d = getDescontos();
  let m = Number(mes)+1, y = Number(ano);
  if(m>11){ m=0; y++; }
  return new Date(y, m, d.diaLimitePagamento||5, 23,59,59);
}
function mensalidadeEmAtraso(m){
  if(m.estado==='pago') return false;
  return new Date() > diaLimiteMensalidade(m.mes,m.ano);
}
function valorComMulta(m){
  const base = Number(m.valor||0);
  if(mensalidadeEmAtraso(m)) return +(base*(1+(getDescontos().multaAtrasoPct||15)/100)).toFixed(2);
  return base;
}
function contarEducandosEncarregado(aluno){
  const key = (aluno.encarregadoContacto||'').trim().toLowerCase();
  if(!key) return 1;
  return state.alunos.filter(a=>a.estado!=='inativo' && (a.encarregadoContacto||'').trim().toLowerCase()===key).length;
}
function descontoIrmaosPercentual(aluno){
  const d = getDescontos();
  return contarEducandosEncarregado(aluno) >= (d.irmaosMinQtd||3) ? (d.irmaosPercentual||0) : 0;
}
function renderMensalidades(){
  const canEdit = canEditModule('diretor','secretaria','financeiro');
  const tab = state.viewParams.tab || 'lista';
  return `<div class="tabs">
    <div class="tab ${tab==='lista'?'active':''}" onclick="navigate('mensalidades',{tab:'lista'})">Mensalidades do Mês</div>
    <div class="tab ${tab==='precos'?'active':''}" onclick="navigate('mensalidades',{tab:'precos'})">Preços & Descontos</div>
  </div>
  ${tab==='precos'? renderPrecosTab() : renderMensalidadesLista(canEdit)}`;
}
function renderMensalidadesLista(canEdit){
  const vp = state.viewParams;
  const mes = vp.mes!==undefined? Number(vp.mes) : new Date().getMonth();
  const ano = vp.ano!==undefined? Number(vp.ano) : new Date().getFullYear();
  const lista = state.mensalidades.filter(m=>Number(m.mes)===mes && Number(m.ano)===ano)
    .sort((a,b)=>{
      const an=state.alunos.find(x=>x.id===a.alunoId), bn=state.alunos.find(x=>x.id===b.alunoId);
      return (an?.nome||'').localeCompare(bn?.nome||'');
    });
  const totalEsperado = lista.reduce((s,m)=>s+valorComMulta(m),0);
  const totalPago = lista.reduce((s,m)=>s+Number(m.valorPago||0),0);
  const d = getDescontos();
  const rows = lista.map(m=>{
    const a=state.alunos.find(x=>x.id===m.alunoId);
    const t = a?alunoTurma(a):null;
    const atraso = mensalidadeEmAtraso(m);
    const devido = valorComMulta(m);
    const saldo = devido-Number(m.valorPago||0);
    let badge = m.estado==='pago'?['badge-ok','Pago'] : atraso?['badge-danger',`Atrasada +${d.multaAtrasoPct||15}%`] : (Number(m.valorPago||0)>0?['badge-info','Parcial']:['badge-warn','Pendente']);
    return `<tr>
      <td><b>${esc(a?a.nome:'—')}</b>${m.descontoIrmaosPct?`<div class="faint">desc. irmãos ${m.descontoIrmaosPct}%</div>`:''}${m.pagoAntecipado?`<div class="faint">pago antecipado</div>`:''}</td>
      <td>${esc(turmaLabel(t))}</td>
      <td>${fmtMZN(m.valor)}${atraso?`<div class="faint" style="color:var(--danger)">c/ multa: ${fmtMZN(devido)}</div>`:''}</td>
      <td>${fmtMZN(m.valorPago||0)}</td>
      <td><span class="badge ${badge[0]}">${badge[1]}</span></td>
      <td class="row-actions">
        ${canEdit && m.estado!=='pago' ? `<button class="btn btn-ok btn-sm" onclick="registarPagamentoMensalidade('${m.id}')">Registar Pagamento</button>`:''}
        <button class="btn btn-outline btn-sm" onclick="printRecibo('${m.id}')">🖨️ Recibo</button>
        ${canEdit?`<button class="btn btn-danger btn-sm" onclick="deleteDoc('mensalidades','${m.id}','mensalidade')">Remover</button>`:''}
      </td></tr>`;
  }).join('');
  return `
  <div class="grid-cols cols-3" style="margin-bottom:16px;">
    <div class="kpi"><div class="lbl">Total Esperado (c/ multas)</div><div class="val">${fmtMZN(totalEsperado)}</div></div>
    <div class="kpi"><div class="lbl">Total Recebido</div><div class="val" style="color:var(--ok)">${fmtMZN(totalPago)}</div></div>
    <div class="kpi"><div class="lbl">Em Falta</div><div class="val" style="color:var(--danger)">${fmtMZN(totalEsperado-totalPago)}</div></div>
  </div>
  <div class="card">
    <div class="card-head">
      <h3>Mensalidades — ${MESES[mes]} de ${ano}</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select onchange="navigate('mensalidades',{mes:this.value,ano:${ano}})" style="width:auto;">
          ${MESES.map((m,i)=>`<option value="${i}" ${i===mes?'selected':''}>${m}</option>`).join('')}
        </select>
        <select onchange="navigate('mensalidades',{mes:${mes},ano:this.value})" style="width:auto;">
          ${[ano-1,ano,ano+1].map(y=>`<option value="${y}" ${y===ano?'selected':''}>${y}</option>`).join('')}
        </select>
        ${canEdit?`<button class="btn btn-accent btn-sm" onclick="gerarMensalidadesMes(${mes},${ano})">⚡ Gerar do Mês</button>
        <button class="btn btn-primary btn-sm" onclick="editMensalidadeManual(${mes},${ano})">+ Lançar Manual</button>
        <button class="btn btn-outline btn-sm" onclick="pagamentoAntecipado()">📅 Pagamento Antecipado</button>`:''}
      </div>
    </div>
    <p class="faint" style="margin-bottom:10px;">Janela normal de pagamento: dia ${d.diaAberturaPagamento||20} do mês corrente ao dia ${d.diaLimitePagamento||5} do mês seguinte. Após essa data aplica-se automaticamente uma multa de ${d.multaAtrasoPct||15}%.</p>
    ${tableShell(["Aluno","Turma","Valor","Pago","Estado","Acções"], rows, {emptyMsg:"Sem mensalidades lançadas para este mês. Use 'Gerar do Mês'."})}
  </div>`;
}
function gerarMensalidadesMes(mes,ano){
  openFormModal({
    title:"Gerar Mensalidades do Mês",
    fields:[
      {key:'turmaId',label:'Aplicar apenas a uma turma (opcional)',type:'select',options:[["","Todas as turmas"],...state.turmas.map(t=>[t.id,turmaLabel(t)])]},
      {key:'valorFallback',label:'Valor a usar se o nível não tiver preço definido (MT)',type:'number',help:'Defina os preços por nível em "Preços & Descontos" para evitar preencher isto sempre.'}
    ],
    submitLabel:"Gerar",
    onSubmit: async(data)=>{
      let alunosAlvo = state.alunos.filter(a=>a.estado!=='inativo');
      if(data.turmaId) alunosAlvo = alunosAlvo.filter(a=>a.turmaId===data.turmaId);
      const existentes = new Set(state.mensalidades.filter(m=>Number(m.mes)===mes&&Number(m.ano)===ano).map(m=>m.alunoId));
      const batch = db.batch();
      let count=0, semPreco=0;
      alunosAlvo.forEach(a=>{
        if(existentes.has(a.id)) return;
        const t = alunoTurma(a);
        const precoBase = getPrecoMensalidade(t?.nivel) ?? (data.valorFallback||null);
        if(!precoBase){ semPreco++; return; }
        const descIrmaos = descontoIrmaosPercentual(a);
        const valorFinal = +(precoBase*(1-descIrmaos/100)).toFixed(2);
        const ref = db.collection('mensalidades').doc();
        batch.set(ref,{alunoId:a.id, mes, ano, valor:valorFinal, valorBase:precoBase, descontoIrmaosPct:descIrmaos||null, valorPago:0, estado:'pendente', criadoEm:new Date().toISOString()});
        count++;
      });
      await batch.commit();
      toast(count+" mensalidade(s) gerada(s)."+(semPreco?` ${semPreco} aluno(s) ignorado(s) por falta de preço definido para o nível.`:''),"ok");
    }
  });
}
function editMensalidadeManual(mes,ano){
  openFormModal({
    title:"Lançar Mensalidade Manual",
    fields:[
      {key:'alunoId',label:'Aluno',type:'select',required:true,options:[["",'— Seleccionar —'],...state.alunos.map(a=>[a.id,a.nome])]},
      {key:'valor',label:'Valor (MT)',type:'number',required:true}
    ],
    onSubmit: async(data)=>{
      await db.collection('mensalidades').add({...data, mes, ano, valorPago:0, estado:'pendente', criadoEm:new Date().toISOString()});
      toast("Mensalidade lançada.","ok");
    }
  });
}
function registarPagamentoMensalidade(id){
  const m = state.mensalidades.find(x=>x.id===id);
  const atraso = mensalidadeEmAtraso(m);
  const devido = valorComMulta(m);
  openFormModal({
    title:"Registar Pagamento de Mensalidade",
    fields:[
      {key:'valorPago',label:'Valor pago (MT)',type:'number',required:true,help: atraso? `Inclui multa de atraso de ${getDescontos().multaAtrasoPct||15}% (limite era ${fmtDate(diaLimiteMensalidade(m.mes,m.ano))}).` : undefined},
      {key:'formaPagamento',label:'Forma de Pagamento',type:'select',required:true,options:FORMAS_PAGAMENTO},
      {key:'dataPagamento',label:'Data do Pagamento',type:'date',required:true}
    ],
    initial:{valorPago:+(devido-Number(m.valorPago||0)).toFixed(2), dataPagamento:todayISO()},
    submitLabel:"Confirmar Pagamento",
    onSubmit: async(data)=>{
      const novoPago = Number(m.valorPago||0)+Number(data.valorPago);
      const estado = novoPago >= devido ? 'pago' : 'pendente';
      await db.collection('mensalidades').doc(id).update({
        valorPago:novoPago, formaPagamento:data.formaPagamento, dataPagamento:data.dataPagamento, estado,
        multaAplicada: atraso, valorComMultaNoPagamento: atraso?devido:null
      });
      toast("Pagamento registado."+(atraso?" (com multa de atraso)":""),"ok");
    }
  });
}
function pagamentoAntecipado(){
  if(!state.alunos.length){ toast("Registe primeiro um aluno.","err"); return; }
  const now = new Date();
  openFormModal({
    title:"Pagamento Antecipado de Mensalidades",
    fields:[
      {key:'alunoId',label:'Aluno',type:'select',required:true,options:[["",'— Seleccionar —'],...state.alunos.map(a=>[a.id,a.nome])]},
      {key:'mesInicio',label:'Mês inicial',type:'select',required:true,options:MESES.map((m,i)=>[i,m]),half:true},
      {key:'anoInicio',label:'Ano inicial',type:'number',required:true,half:true},
      {key:'quantidadeMeses',label:'Nº de meses a pagar adiantado (mín. 2)',type:'number',required:true,half:true},
      {key:'formaPagamento',label:'Forma de Pagamento',type:'select',required:true,options:FORMAS_PAGAMENTO,half:true},
      {key:'dataPagamento',label:'Data do Pagamento',type:'date',required:true}
    ],
    initial:{mesInicio:now.getMonth(),anoInicio:now.getFullYear(),quantidadeMeses:2,dataPagamento:todayISO()},
    submitLabel:"Registar Pagamento Antecipado",
    onSubmit: async(data)=>{
      const qtd = Number(data.quantidadeMeses);
      if(qtd<2){ throw new Error("A quantidade mínima para pagamento adiantado é 2 mensalidades."); }
      const aluno = state.alunos.find(a=>a.id===data.alunoId);
      const turma = alunoTurma(aluno);
      const precoBase = getPrecoMensalidade(turma?.nivel);
      if(!precoBase){ throw new Error(`Defina primeiro o preço da mensalidade para o nível "${turma?.nivel||'—'}" em Preços & Descontos.`); }
      const descIrmaos = descontoIrmaosPercentual(aluno);
      const precoComIrmaos = precoBase*(1-descIrmaos/100);
      const d = getDescontos();
      const descAdiant = qtd>=(d.adiantamentoMinMeses||2) ? (d.adiantamentoPercentual||0) : 0;
      const valorMensalFinal = +(precoComIrmaos*(1-descAdiant/100)).toFixed(2);
      const batch = db.batch();
      let mes=Number(data.mesInicio), ano=Number(data.anoInicio);
      for(let i=0;i<qtd;i++){
        const existente = state.mensalidades.find(m=>m.alunoId===aluno.id && Number(m.mes)===mes && Number(m.ano)===ano);
        const payload = {alunoId:aluno.id, mes, ano, valor:valorMensalFinal, valorBase:precoBase,
          descontoIrmaosPct:descIrmaos||null, descontoAdiantamentoPct:descAdiant||null,
          valorPago:valorMensalFinal, formaPagamento:data.formaPagamento, dataPagamento:data.dataPagamento,
          estado:'pago', pagoAntecipado:true};
        const ref = existente ? db.collection('mensalidades').doc(existente.id) : db.collection('mensalidades').doc();
        batch.set(ref,payload,{merge:true});
        mes++; if(mes>11){ mes=0; ano++; }
      }
      await batch.commit();
      toast(`${qtd} mensalidade(s) pagas antecipadamente`+(descAdiant?` com ${descAdiant}% de desconto`:'')+".","ok");
    }
  });
}

/* =================================================================
   17. FOLHA DE SALÁRIO  (INSS + IRPS conforme legislação moçambicana)
================================================================== */
function calcIRPS(baseTributavel){
  const legal = state.legal || DEFAULT_LEGAL;
  const tributavel = Math.max(0, baseTributavel - (legal.deducaoPessoalMensal||0));
  const tabela = legal.irpsTable || DEFAULT_IRPS_TABLE;
  for(const escalao of tabela){
    if(tributavel <= escalao.ate){
      const val = tributavel*escalao.taxa - escalao.deduzir;
      return Math.max(0, val);
    }
  }
  return 0;
}
function calcFolhaFuncionario(f, mes, ano){
  const legal = state.legal || DEFAULT_LEGAL;
  const salarioBase = Number(f.salarioBase||0);
  const faltas = state.assiduidade.filter(a=>a.funcionarioId===f.id && a.estado==='falta' && a.data.slice(0,7)===`${ano}-${String(mes+1).padStart(2,'0')}`).length;
  const valorDia = salarioBase/26;
  const descontoFaltas = faltas*valorDia;
  const adiantamentosMes = state.adiantamentos.filter(a=>a.funcionarioId===f.id && Number(a.mesDesconto)===mes && Number(a.anoDesconto)===ano && a.estado!=='descontado');
  const totalAdiantamentos = adiantamentosMes.reduce((s,a)=>s+Number(a.valor||0),0);
  const salarioIliquido = salarioBase; // subsídios podem ser adicionados manualmente na edição
  const inss = salarioIliquido*(legal.inssEmpregado||0.03);
  const irps = calcIRPS(salarioIliquido);
  const totalDescontos = inss+irps+descontoFaltas+totalAdiantamentos;
  const liquido = salarioIliquido - totalDescontos;
  return {salarioBase,faltas,descontoFaltas,adiantamentosMes,totalAdiantamentos,inss,irps,liquido,inssPatronal:salarioIliquido*(legal.inssEntidade||0.04)};
}
function renderFolha(){
  const canProcess = canEditModule('diretor','rh');
  const now = new Date();
  const mes = state.viewParams.mes!==undefined? Number(state.viewParams.mes) : now.getMonth();
  const ano = state.viewParams.ano!==undefined? Number(state.viewParams.ano) : now.getFullYear();
  const jaProcessada = state.folhas.filter(x=>Number(x.mes)===mes && Number(x.ano)===ano);
  const ativos = state.funcionarios.filter(f=>f.estado!=='inativo');
  let totalLiquido=0, totalDescontos=0, totalINSSPatronal=0;
  const rows = ativos.map(f=>{
    const salva = jaProcessada.find(x=>x.funcionarioId===f.id);
    const calc = salva || calcFolhaFuncionario(f,mes,ano);
    totalLiquido += Number(calc.liquido||0);
    totalDescontos += Number(calc.inss||0)+Number(calc.irps||0)+Number(calc.descontoFaltas||0)+Number(calc.totalAdiantamentos||0);
    totalINSSPatronal += Number(calc.inssPatronal||0);
    return `<tr>
      <td><b>${esc(f.nome)}</b><div class="faint">${esc(f.funcao)}</div></td>
      <td>${fmtMZN(calc.salarioBase)}</td>
      <td>${fmtMZN(calc.inss)}</td>
      <td>${fmtMZN(calc.irps)}</td>
      <td>${fmtMZN(calc.descontoFaltas)}${calc.faltas?` <span class="faint">(${calc.faltas}d)</span>`:''}</td>
      <td>${fmtMZN(calc.totalAdiantamentos)}</td>
      <td><b>${fmtMZN(calc.liquido)}</b></td>
      <td class="row-actions">
        <button class="btn btn-outline btn-sm" onclick="printReciboVencimento('${f.id}',${mes},${ano})">🖨️ Recibo</button>
      </td></tr>`;
  }).join('');
  return `
  <div class="grid-cols cols-3" style="margin-bottom:16px;">
    <div class="kpi"><div class="lbl">Total Líquido a Pagar</div><div class="val">${fmtMZN(totalLiquido)}</div></div>
    <div class="kpi"><div class="lbl">Total Descontos</div><div class="val">${fmtMZN(totalDescontos)}</div></div>
    <div class="kpi"><div class="lbl">INSS Patronal (4%)</div><div class="val">${fmtMZN(totalINSSPatronal)}</div></div>
  </div>
  <div class="card">
    <div class="card-head">
      <h3>Folha de Salário — ${MESES[mes]} de ${ano} ${jaProcessada.length?'<span class="badge badge-ok" style="margin-left:8px;">Processada</span>':'<span class="badge badge-warn" style="margin-left:8px;">Simulação (não gravada)</span>'}</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select onchange="navigate('folha',{mes:this.value,ano:${ano}})" style="width:auto;">${MESES.map((m,i)=>`<option value="${i}" ${i===mes?'selected':''}>${m}</option>`).join('')}</select>
        <select onchange="navigate('folha',{mes:${mes},ano:this.value})" style="width:auto;">${[ano-1,ano,ano+1].map(y=>`<option value="${y}" ${y===ano?'selected':''}>${y}</option>`).join('')}</select>
        ${canProcess && !jaProcessada.length ? `<button class="btn btn-primary btn-sm" onclick="processarFolha(${mes},${ano})">Processar e Gravar Folha</button>`:''}
        ${canProcess && jaProcessada.length ? `<button class="btn btn-outline btn-sm" onclick="printFolhaConsolidada(${mes},${ano})">🖨️ Folha Consolidada</button>`:''}
      </div>
    </div>
    <p class="faint" style="margin-bottom:10px;">INSS: ${((state.legal?.inssEmpregado||0.03)*100).toFixed(0)}% trabalhador / ${((state.legal?.inssEntidade||0.04)*100).toFixed(0)}% entidade patronal · IRPS calculado por escalões progressivos. Ajustável em Configurações.</p>
    ${tableShell(["Funcionário","Salário Base","INSS (3%)","IRPS","Faltas","Adiantamentos","Líquido a Pagar","Acções"], rows, {emptyMsg:"Nenhum funcionário activo."})}
  </div>`;
}
async function processarFolha(mes,ano){
  confirmAction(`Processar e gravar a folha de salário de ${MESES[mes]}/${ano}? Os adiantamentos deste mês serão marcados como descontados.`, async ()=>{
    const ativos = state.funcionarios.filter(f=>f.estado!=='inativo');
    const batch = db.batch();
    ativos.forEach(f=>{
      const calc = calcFolhaFuncionario(f,mes,ano);
      const ref = db.collection('folhas').doc();
      batch.set(ref,{funcionarioId:f.id, mes, ano, ...calc, processadoEm:new Date().toISOString()});
    });
    state.adiantamentos.filter(a=>Number(a.mesDesconto)===mes && Number(a.anoDesconto)===ano && a.estado!=='descontado')
      .forEach(a=>batch.update(db.collection('adiantamentos').doc(a.id),{estado:'descontado'}));
    await batch.commit();
    toast("Folha processada e gravada.","ok");
  });
}
function printReciboVencimento(funcionarioId,mes,ano){

  const salva = state.folhas.find(x=>x.funcionarioId===funcionarioId && Number(x.mes)===mes && Number(x.ano)===ano);

    <h2 style="margin-top:14px;font-size:15px;">RECIBO DE VENCIMENTO — ${MESES[mes]} / ${ano}</h2></div>
    <table class="slip-table">
      <tr><th>Funcionário</th><td>${esc(f.nome)}</td></tr>
      <tr><th>Função</th><td>${esc(f.funcao)}</td></tr>
      <tr><th>Nº INSS</th><td>${esc(f.numeroINSS||'—')}</td></tr>

    <table class="slip-table">
      <tr><th>Vencimentos</th><th>Valor</th></tr>
      <tr><td>Salário Base</td><td>${fmtMZN(calc.salarioBase)}</td></tr>
      <tr><th>Descontos</th><th>Valor</th></tr>
      <tr><td>INSS (${((state.legal?.inssEmpregado||0.03)*100).toFixed(0)}%)</td><td>${fmtMZN(calc.inss)}</td></tr>
      <tr><td>IRPS</td><td>${fmtMZN(calc.irps)}</td></tr>

  printHtml(html);

function printFolhaConsolidada(mes,ano){
  const registos = state.folhas.filter(x=>Number(x.mes)===mes && Number(x.ano)===ano);
  const total = registos.reduce((s,r)=>s+Number(r.liquido||0),0);

      if(id) await db.collection('planosAvaliacao').doc(id).update(payload);
      else await db.collection('planosAvaliacao').add({...payload, estado:'rascunho', criadoEm:new Date().toISOString()});
      toast("Plano guardado como rascunho.","ok");
    }
  });
  // botão extra de submissão, adicionado após render do modal
  setTimeout(()=>{
    const foot = document.querySelector('#active-modal .modal-foot');
    if(foot && !foot.querySelector('.btn-submeter-plano')){
      const b=document.createElement('button');
      b.className='btn btn-accent btn-submeter-plano';
      b.textContent='Guardar e Submeter para Aprovação';
      b.onclick=async()=>{
        const turmaId=document.getElementById('fld_turmaId').value, trimestre=document.getElementById('fld_trimestre').value, conteudo=document.getElementById('fld_conteudo').value;
        if(!turmaId||!conteudo){ toast("Preencha turma e conteúdo.","err"); return; }

        else await db.collection('planosAvaliacao').add(payload);
        toast("Plano submetido para aprovação da Coordenação Pedagógica.","ok");
        closeModal();
      };
      foot.insertBefore(b, foot.firstChild);
    }
  },50);
}

        </select>
        <select onchange="navigate('professor',{tab:'notas',turmaId:'${turmaId}',trimestre:this.value})" style="width:auto;">
          ${['1º Trimestre','2º Trimestre','3º Trimestre'].map(tr=>`<option ${trimestre===tr?'selected':''}>${tr}</option>`).join('')}
        </select>
      </div>
    </div>
    ${pauta?`<p><span class="badge ${pauta.estado==='confirmada'?'badge-ok':'badge-warn'}">${pauta.estado==='confirmada'?'Pauta Confirmada':'Pauta '+(pauta.estado==='submetida'?'Submetida':'em Rascunho')}</span></p>`:''}
    <div id="notas-body">${tableShell(["Aluno","Nota (0-20)"],rows,{emptyMsg:"Sem alunos nesta turma."})}</div>
    ${pauta?.estado!=='confirmada'?`<div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn btn-outline btn-sm" onclick="guardarNotas('${turmaId}','${trimestre}','${pauta?.id||''}',false)">Guardar Rascunho</button>

async function guardarNotas(turmaId,trimestre,pautaId,submeter){
  const notas={};
  document.querySelectorAll('#notas-body input').forEach(i=>{ if(i.value!=='') notas[i.dataset.aluno]=Number(i.value); });
  const payload = {turmaId,trimestre,professorId:state.funcionarioId,notas,estado:submeter?'submetida':'rascunho'};
  if(submeter) payload.submetidoEm=new Date().toISOString();
  if(pautaId) await db.collection('pautas').doc(pautaId).update(payload);
  else await db.collection('pautas').add(payload);
  toast(submeter?"Pauta submetida à Coordenação Pedagógica.":"Rascunho guardado.","ok");
}

function renderConfigReset(){
  if(state.role!=='diretor'){
    return `<div class="empty-state"><p>Apenas o(a) Director(a) pode aceder a esta secção.</p></div>`;
  }
  return `<div class="card" style="max-width:640px;border:1px solid var(--danger,#dc2626);">
    <h3 style="color:var(--danger,#dc2626);margin-bottom:8px;">⚠️ Reset Total do Sistema</h3>
    <p class="faint" style="margin-bottom:10px;">Esta acção apaga <b>permanentemente e sem possibilidade de recuperação</b>: todos os alunos, matrículas, mensalidades, funcionários, contratos, assiduidade, adiantamentos, folhas de salário, planos de avaliação, pautas, horários, despesas, necessidades, preços de mensalidades, todos os perfis de utilizador (incluindo o seu, de Director) e as configurações da escola.</p>
    <p class="faint" style="margin-bottom:10px;">No fim, o sistema fica <b>virgem</b> — a sua sessão é terminada e a conta de Director é eliminada, arrancando novamente o assistente de configuração inicial (passo 1: dados da escola → passo 2: nova conta de Director).</p>
    <p class="faint" style="margin-bottom:14px;"><b>Nota:</b> por limitação do Firebase no lado do cliente, este botão só consegue eliminar a conta de autenticação do utilizador actualmente ligado (o Director). Contas de outros utilizadores (RH, professores, etc.) perdem o respectivo perfil e ficam sem acesso, mas o registo de autenticação em si só é removido por si na consola do Firebase (Authentication → Users), se desejar limpar tudo por completo.</p>
    <button class="btn btn-danger" onclick="abrirResetSistema()">Apagar Tudo e Entregar Sistema Virgem</button>
  </div>`;
}
function abrirResetSistema(){
  openModal(`
    <div class="modal-head"><h3 style="color:var(--danger,#dc2626);">⚠️ Confirmar Reset Total</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="margin-bottom:10px;">Esta acção é <b>irreversível</b>. Todos os dados serão apagados e a sua conta de Director será eliminada.</p>
      <div class="field"><label>Escreva <b>APAGAR TUDO</b> para confirmar</label><input id="reset-confirm-text" placeholder="APAGAR TUDO"></div>
      <div class="field"><label>Confirme a sua senha actual</label><input id="reset-confirm-pass" type="password"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="reset-confirm-btn">Apagar Tudo Definitivamente</button></div>
  `);
  document.getElementById('reset-confirm-btn').onclick = async ()=>{
    const txt = document.getElementById('reset-confirm-text').value.trim();
    const pass = document.getElementById('reset-confirm-pass').value;
    if(txt!=='APAGAR TUDO'){ toast('Escreva exactamente "APAGAR TUDO" para confirmar.','err'); return; }
    if(!pass){ toast('Introduza a sua senha para confirmar.','err'); return; }
    const btn = document.getElementById('reset-confirm-btn'); btn.disabled=true; btn.textContent='A apagar…';
    try{
      await executarResetSistema(pass);
    }catch(err){
      toast('Erro ao apagar: '+err.message,'err');
      btn.disabled=false; btn.textContent='Apagar Tudo Definitivamente';
    }
  };
}
async function executarResetSistema(pass){
  const user = auth.currentUser;
  if(!user) throw new Error('Sessão inválida.');
  // Reautentica (necessário para poder eliminar a conta)
  const cred = firebase.auth.EmailAuthProvider.credential(user.email, pass);
  await user.reauthenticateWithCredential(cred);

  // Apaga todas as colecções de dados + utilizadores, em lotes de 400
  const colsToWipe = [...COLLECTIONS, 'users'];
  for(const col of colsToWipe){
    let snap = await db.collection(col).limit(400).get();
    while(!snap.empty){
      const batch = db.batch();
      snap.docs.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      snap = await db.collection(col).limit(400).get();
    }
  }
  // Apaga documentos de configuração
  await Promise.all(['school','legal','descontos'].map(id=>db.collection('config').doc(id).delete().catch(()=>{})));

  detachListeners();
  toast('Sistema apagado. A preparar configuração inicial…','ok');
  // Elimina por último a própria conta de autenticação do Director
  await user.delete();
  setTimeout(()=>location.reload(), 800);
}
function criarUtilizador(){
  openFormModal({
    title:"Novo Utilizador",
    fields:[
      {key:'nome',label:'Nome completo',required:true},
      {key:'email',label:'Email',type:'email',required:true,half:true},
      {key:'pass',label:'Senha inicial',type:'password',required:true,half:true},
      {key:'role',label:'Perfil',type:'select',required:true,options:Object.entries(ROLES).map(([k,v])=>[k,v.label])},
      {key:'funcionarioId',label:'Ligar a um Funcionário (opcional, recomendado p/ Professor)',type:'select',options:[["",'— Nenhum —'],...state.funcionarios.map(f=>[f.id,f.nome])]}
    ],
    submitLabel:"Criar Utilizador",
    onSubmit: async(data)=>{
      // Usa uma app Firebase secundária para não substituir a sessão actual do Director.
      const secondary = firebase.initializeApp(firebaseConfig, 'secondary_'+Date.now());
      try{
        const cred = await secondary.auth().createUserWithEmailAndPassword(data.email,data.pass);
        await db.collection('users').doc(cred.user.uid).set({nome:data.nome,email:data.email,role:data.role,funcionarioId:data.funcionarioId||null,criadoEm:new Date().toISOString()});
        toast("Utilizador criado.","ok");
      } finally { await secondary.delete(); }
    }
  });
}
function editUtilizadorLigacao(uidToEdit){
  const u = state.usersList.find(x=>x.id===uidToEdit);
  openFormModal({
    title:"Editar Utilizador",
    fields:[
      {key:'nome',label:'Nome',required:true},
      {key:'role',label:'Perfil',type:'select',required:true,options:Object.entries(ROLES).map(([k,v])=>[k,v.label])},
      {key:'funcionarioId',label:'Ligar a um Funcionário',type:'select',options:[["",'— Nenhum —'],...state.funcionarios.map(f=>[f.id,f.nome])]}
    ],
    initial:u,
    onSubmit: async(data)=>{ await db.collection('users').doc(uidToEdit).update(data); toast("Perfil actualizado.","ok"); }
  });
}

function enviarLinkSenha(uidX){
  const u=state.usersList.find(x=>x.id===uidX); if(!u) return;
  confirmAction(`Enviar para ${u.email} um link para o utilizador definir uma nova senha?`, async()=>{
    try{ await auth.sendPasswordResetEmail(u.email); toast('Link enviado para '+u.email,'ok'); }
    catch(err){ toast('Erro: '+(err.message||''),'err'); }
  });
}
function removerUtilizador(uidX){
  const u=state.usersList.find(x=>x.id===uidX); if(!u) return;
  confirmAction(`Remover o acesso de ${u.nome}? Deixará de conseguir usar o sistema. Os dados do funcionário em "Funcionários" não são apagados.`, async()=>{
    await db.collection('users').doc(uidX).delete();
    toast('Acesso removido.','ok');
  });
}
